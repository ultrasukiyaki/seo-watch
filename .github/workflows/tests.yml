name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, openssl, json, mbstring
      - name: PHP syntax
        run: find . -name '*.php' -not -path './config/local.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php bin/test.php
      - name: JavaScript syntax
        run: node --check assets/app.js
      - name: Shell syntax
        run: sh -n bin/package.sh bin/cron.sh.example

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring
      - name: MySQL integration tests
        env:
          SEO_WATCH_TEST_DSN: mysql:host=127.0.0.1;port=3306
          SEO_WATCH_TEST_USER: root
          SEO_WATCH_TEST_PASS: test-root-password
        run: php tests/integration.php
